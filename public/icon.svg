<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="#0d0f14"/>
  <!-- Inner card -->
  <rect x="10" y="10" width="172" height="172" rx="28" fill="#161922"/>
  <!-- Subtle border -->
  <rect x="10" y="10" width="172" height="172" rx="28" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Diamond gem shape -->
  <polygon points="96,32 148,82 96,160 44,82" fill="#6366f1" opacity="0.15"/>
  <polygon points="96,32 148,82 96,160 44,82" fill="none" stroke="#6366f1" stroke-width="3"/>
  <!-- Inner diamond highlight -->
  <polygon points="96,52 130,82 96,136 62,82" fill="#6366f1" opacity="0.25"/>
  <!-- Center dot -->
  <circle cx="96" cy="96" r="8" fill="#facc15"/>
  <!-- Corner accents -->
  <circle cx="96" cy="32" r="4" fill="#6366f1"/>
  <circle cx="148" cy="82" r="4" fill="#6366f1"/>
  <circle cx="96" cy="160" r="4" fill="#6366f1"/>
  <circle cx="44" cy="82" r="4" fill="#6366f1"/>
</svg>
