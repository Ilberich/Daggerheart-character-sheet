<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daggerheart">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <title>Daggerheart</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.jsx"></script>

  <!-- Install banner (Android Chrome) — hidden until beforeinstallprompt fires -->
  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });
    function triggerInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    }
  </script>

  <div id="install-banner" style="
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: #1c2030; border-top: 1px solid #6366f1;
    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    align-items: center; justify-content: space-between; gap: 12px;
    font-family: 'Crimson Pro', Georgia, serif;
  ">
    <div>
      <div style="font-size:14px; font-weight:800; color:#e2e4f0;">Install Daggerheart</div>
      <div style="font-size:11px; color:#8890b0; margin-top:2px;">Add to home screen for offline use</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button onclick="document.getElementById('install-banner').style.display='none'"
        style="padding:7px 12px; border-radius:7px; border:1px solid #2a3050;
               background:transparent; color:#8890b0; font-size:12px; cursor:pointer;">
        Later
      </button>
      <button onclick="triggerInstall()"
        style="padding:7px 14px; border-radius:7px; border:none;
               background:#6366f1; color:#fff; font-size:12px; font-weight:700; cursor:pointer;">
        Install
      </button>
    </div>
  </div>
</body>
</html>
